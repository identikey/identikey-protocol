[workspace]
resolver = "2"
members = [
    "crates/identikey-auth",
    "crates/identikey-log",
    "crates/identikey-wallet",
    "ikey",
]
# The vendored Blockchain Commons forks are *patch* sources, not members: they
# must build with their own upstream dependency resolution, and they are meant
# to be deleted wholesale when upstream ships the fixes.
exclude = [
    "vendor/bc-shamir",
    "vendor/dcbor",
]

# ---------------------------------------------------------------------------
# Vendored upstream forks — see vendor/*/VENDOR.md for the one-line diffs,
# the measurements, and the deletion criteria.
#
# Both are prerequisites for building anything Gordian-based for
# wasm32-unknown-unknown:
#   bc-shamir 0.13.0 — force-enables bc-crypto/secp256k1 (C, no wasm32).
#                      BlockchainCommons/bc-shamir-rust#4
#   dcbor     0.25.2 — chrono default features pull wasmbind → wasm-bindgen,
#                      which breaks the one-host-import invariant.
#                      BlockchainCommons/bc-dcbor-rust#6
#
# DEBT, RECORDED DELIBERATELY: these two directories are byte-for-byte
# duplicates of `vendor/bc-shamir` and `vendor/dcbor` in the Dreamball repo.
# A cross-repo relative path would be fragile to commit, so both repositories
# carry their own copy. When the upstream issues above are merged and
# released, BOTH copies and BOTH [patch.crates-io] blocks are deleted
# together — see vendor/DUPLICATION.md.
# ---------------------------------------------------------------------------
[patch.crates-io]
bc-shamir = { path = "vendor/bc-shamir" }
dcbor = { path = "vendor/dcbor" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR BSD-2-Clause-Patent"
repository = "https://github.com/identikey/identikey-protocol"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
bc-envelope = "=0.43.0"
blake3 = "1"
bs58 = "0.5"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
dialoguer = "0.11"
directories = "5"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
keyring = { version = "3", default-features = false }
proptest = "1"
rand = "0.8"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
zeroize = { version = "1.7", features = ["derive"] }
