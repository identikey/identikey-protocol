[package]
name = "identikey-wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Password-encrypted identity wallet: Argon2id + XChaCha20-Poly1305 file format, OS keychain caching, Gordian Envelope container"

[dependencies]
anyhow = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
bc-envelope = { workspace = true }
blake3 = { workspace = true }
chacha20poly1305 = { workspace = true }
dialoguer = { workspace = true }
directories = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
zeroize = { workspace = true }

# OS keyring integration (platform-specific features below)
keyring = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = { workspace = true }
