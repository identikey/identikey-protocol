[package]
name = "identikey-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "IdentiKey hardware-enclave-backed challenge/response authentication protocol"
readme = "README.md"

[features]
default = []
# Hardware signers. Off by default so a verifier build skips them:
# Linux gets tss-esapi, macOS gets the Secure Enclave and keychain
# crates (security-framework), only when this feature is on.
enclave = [
    "dep:tss-esapi",
    "dep:sha2",
    "dep:security-framework",
    "dep:security-framework-sys",
    "dep:core-foundation",
]

[dependencies]
# Classical signatures
ed25519-dalek = { workspace = true }
p256 = { version = "0.13", features = ["ecdsa"] }
# Post-quantum signatures (FIPS 204 / ML-DSA), pure Rust, no C deps
fips204 = "0.4"
# Fingerprints + identifiers
blake3 = "1"
bs58 = { workspace = true }
# RNG for keygen + nonces
rand_core = { workspace = true }
# Hygiene + errors
zeroize = { workspace = true }
thiserror = { workspace = true }

# macOS Secure Enclave + Touch ID, persisted in the file keychain.
# Optional, same `enclave` feature as the Linux TPM backend.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", optional = true }
security-framework-sys = { version = "2.17", optional = true }
core-foundation = { version = "0.10", optional = true }

# Windows TPM (CNG Platform Crypto Provider) + Windows Hello backend.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
] }
sha2 = "0.10"

# Linux TPM 2.0 backend via the tpm2-tss ESAPI. System deps: tpm2-tss (libtss2-*).
# `tss-esapi` is optional and switched on by the `enclave` feature. A
# `feature = "..."` key inside `target.'cfg(...)'` does not select deps.
[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = { version = "7.7", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
proptest = { workspace = true }

[[example]]
name = "enclave_demo"
required-features = ["enclave"]

[[example]]
name = "ed25519_wrap_demo"
required-features = ["enclave"]
